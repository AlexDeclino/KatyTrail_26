<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katy Trail — Interactive Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>Katy Trail Interactive Map</h1>
  <p>Click a marker to learn more about that spot along the trail.</p>
</header>

<main class="map-stage">
  <div class="map-wrap" id="map-wrap">
    <img src="assets/katy-trail-map.png" alt="Map of the Katy Trail" class="map-image" id="map-image">
    <div class="markers" id="markers"></div>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <button class="overlay-close" id="overlay-close" aria-label="Close">&times;</button>
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <div class="overlay-gallery" id="overlay-gallery"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
