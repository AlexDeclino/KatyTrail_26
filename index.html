<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katy Trail — Interactive Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>Katy Trail Interactive Map</h1>
</header>

<main class="map-stage" id="map-stage">
  <div class="map-wrap" id="map-wrap">
    <img src="assets/katy-trail-map.png" alt="Map of the Katy Trail" class="map-image" id="map-image">
    <div class="scatter-lines" id="scatter-lines"></div>
    <div class="markers" id="markers"></div>
  </div>

  <div class="zoom-controls">
    <button type="button" class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" class="zoom-btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
    <button type="button" class="zoom-btn zoom-btn-reset" id="zoom-reset" aria-label="Reset zoom">&#8634;</button>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <div class="overlay-gallery" id="overlay-gallery"></div>
  </div>
  <button type="button" class="return-home" id="return-home">Return to Home</button>
</div>

<script src="assets/sites.js"></script>
<script src="script.js"></script>
</body>
</html>
